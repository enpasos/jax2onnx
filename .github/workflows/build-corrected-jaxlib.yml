name: Corrected CPU jaxlib build pilot

on:
  push:
    branches: [precision-migration]
    paths:
    - build_support/jaxlib/xla-0.10.2-bf16-nested-conversion.patch
    - build_support/jaxlib/cpu-bf16-build-recipe.json
    - scripts/build_corrected_jaxlib.py
    - .github/workflows/build-corrected-jaxlib.yml
    - tests/extra_tests/framework/test_corrected_jaxlib_recipe.py
    - docs/about/dependencies.md
  workflow_dispatch:
    inputs:
      use_completed_cache:
        description: Use only an exact recipe and ABI cache hit
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: CPU compiler candidate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Verify finite recipe controls
      run: python -B -m unittest tests.extra_tests.framework.test_corrected_jaxlib_recipe

    - name: Describe exact recipe and ABI key
      id: recipe
      run: |
        python -B scripts/build_corrected_jaxlib.py describe \
          --python-version '${{ matrix.python-version }}' >> "$GITHUB_OUTPUT"

    - name: Check actual startup capacity before downloads
      run: |
        python -B scripts/build_corrected_jaxlib.py preflight \
          --python-version '${{ matrix.python-version }}' \
          --out "$RUNNER_TEMP/corrected-jaxlib-preflight-${{ matrix.python-version }}"

    - name: Restore completed wheel and manifest by exact key
      id: cache
      if: github.event_name == 'push' || inputs.use_completed_cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        key: ${{ steps.recipe.outputs.cache_key }}
        path: ${{ runner.temp }}/corrected-jaxlib-build-${{ matrix.python-version }}/completed
        enableCrossOsArchive: false

    - name: Verify exact cached bytes without installation
      if: steps.cache.outputs.cache-hit == 'true'
      run: |
        python -B scripts/build_corrected_jaxlib.py verify-cache \
          --python-version '${{ matrix.python-version }}' \
          --cache-dir "$RUNNER_TEMP/corrected-jaxlib-build-${{ matrix.python-version }}/completed" \
          --out "$RUNNER_TEMP/corrected-jaxlib-cache-proof-${{ matrix.python-version }}"

    - name: Build in one fresh owned remote process tree
      id: build
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        python -B scripts/build_corrected_jaxlib.py build \
          --python-version '${{ matrix.python-version }}' \
          --out "$RUNNER_TEMP/corrected-jaxlib-build-${{ matrix.python-version }}"

    - name: Save complete byte-verified wheel and manifest
      if: (github.event_name == 'push' || inputs.use_completed_cache) && steps.build.outcome == 'success'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        key: ${{ steps.recipe.outputs.cache_key }}
        path: ${{ runner.temp }}/corrected-jaxlib-build-${{ matrix.python-version }}/completed
        enableCrossOsArchive: false

    - name: Retain every completed artifact and failed trial log
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: corrected-jaxlib-candidate-cp${{ matrix.python-version }}-${{ github.run_id }}
        if-no-files-found: warn
        retention-days: 14
        path: |
          ${{ runner.temp }}/corrected-jaxlib-preflight-${{ matrix.python-version }}/trial.json
          ${{ runner.temp }}/corrected-jaxlib-cache-proof-${{ matrix.python-version }}/trial.json
          ${{ runner.temp }}/corrected-jaxlib-build-${{ matrix.python-version }}/completed
          ${{ runner.temp }}/corrected-jaxlib-build-${{ matrix.python-version }}/unverified
          ${{ runner.temp }}/corrected-jaxlib-build-${{ matrix.python-version }}/*.log
          ${{ runner.temp }}/corrected-jaxlib-build-${{ matrix.python-version }}/*-owned-identities.jsonl
          ${{ runner.temp }}/corrected-jaxlib-build-${{ matrix.python-version }}/resources.jsonl
          ${{ runner.temp }}/corrected-jaxlib-build-${{ matrix.python-version }}/trial.json
