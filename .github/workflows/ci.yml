name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      acceptance_mode:
        description: Full milestone/final acceptance or routine checks
        type: choice
        options: [full, routine]
        default: full


permissions:
  contents: read

# Remains a nonreplacement qualification campaign until every new owner is
# accepted. Only a subsequent reviewed ordinary commit may change this literal.
env:
  PRECISION_ROUTINE_ACTIVATED: 'false'

jobs:
  acceptance-context:
    name: Resolve acceptance commit and scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      head_sha: ${{ steps.mode.outputs.head_sha }}
      full_acceptance: ${{ steps.mode.outputs.full_acceptance }}
      routine_activated: ${{ steps.mode.outputs.routine_activated }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Resolve exact commit and exhaustive triggers
      id: mode
      env:
        EXPECTED_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        REQUESTED_ACCEPTANCE_MODE: ${{ inputs.acceptance_mode || '' }}
      run: |
        set -euo pipefail
        python -B scripts/run_with_resources.py \
          --output-dir "$RUNNER_TEMP/acceptance-context-resources" \
          --timeout-seconds 240 --max-rss-mib 4096 --min-available-mib 2048 \
          --min-disk-free-mib 4096 --disk-path "$RUNNER_TEMP" --disk-path "$GITHUB_WORKSPACE" -- \
          python -B - <<'PY_MODE'
        import json
        import os
        from pathlib import Path
        import re
        import subprocess

        def git(*arguments):
            return subprocess.check_output(["git", *arguments])

        activated = os.environ["PRECISION_ROUTINE_ACTIVATED"]
        if activated not in {"true", "false"}:
            raise SystemExit("Invalid tracked routine activation state")
        head = os.environ["EXPECTED_CHECKOUT_SHA"]
        if not re.fullmatch(r"[0-9a-f]{40}", head):
            raise SystemExit("Acceptance requires one exact commit SHA")
        if git("rev-parse", "HEAD").decode().strip() != head:
            raise SystemExit("Acceptance checkout differs from the selected commit")
        event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
        message = git("show", "-s", "--format=%B", head).decode()
        full = True
        reason = "conservative exhaustive fallback"
        if re.search(r"(?m)^Precision-Acceptance: full[ \t]*$", message):
            reason = "reviewed full acceptance commit marker"
        elif os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
            requested = os.environ["REQUESTED_ACCEPTANCE_MODE"]
            if requested not in {"routine", "full"}:
                raise SystemExit("Unknown acceptance mode")
            full = requested == "full"
            reason = "explicit manual " + requested + " acceptance"
        elif os.environ["GITHUB_EVENT_NAME"] == "pull_request" and event.get("action") == "synchronize":
            before = event.get("before", "")
            if re.fullmatch(r"[0-9a-f]{40}", before) and event.get("after") == head:
                present = subprocess.run(["git", "cat-file", "-e", before + "^{commit}"], capture_output=True).returncode == 0
                if not present:
                    present = subprocess.run(["git", "fetch", "--no-tags", "--depth=1", "origin", before]).returncode == 0
                if present:
                    changed = git("diff", "--name-only", "-z", before, head).decode().split("\0")[:-1]
                    # Only reviewed orchestration/docs edits can reuse unrelated
                    # exhaustive evidence. New/unknown production, runtime,
                    # reference, criterion, model and test paths force full work.
                    routine_files = {
                        "README.md", ".github/workflows/ci.yml", ".github/workflows/nightly-qs.yml",
                        "scripts/run_with_resources.py", "scripts/_ci_standard_execution.py",
                        "scripts/run_pytest_batches.py", "scripts/prepare_ci_standard.py",
                        "scripts/prepare_ci_download_cache.py",
                        "tests/extra_tests/framework/test_ci_download_cache.py",
                        "tests/extra_tests/framework/test_ci_lane_selection.py",
                        "tests/extra_tests/framework/test_ci_standard_parts.py",
                        "tests/extra_tests/framework/test_prepare_ci_standard.py",
                        "tests/extra_tests/framework/test_run_with_resources.py",
                        "tests/extra_tests/framework/test_pytest_batches.py",
                    }
                    full = any(name not in routine_files and not (name.endswith(".md") and name.startswith(("docs/", "internal_docs/"))) for name in changed)
                    reason = "changed acceptance assumptions" if full else "reviewed routine orchestration/docs transition"
        if git("rev-parse", "HEAD").decode().strip() != head:
            raise SystemExit("Acceptance head changed while resolving scope")
        with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
            output.write("head_sha=" + head + "\n")
            output.write("full_acceptance=" + str(full).lower() + "\n")
            output.write("routine_activated=" + activated + "\n")
        print("Acceptance commit:", head, "; full:", full, "; reason:", reason)
        PY_MODE
        cp -- "$GITHUB_OUTPUT" "$RUNNER_TEMP/acceptance-context-resources/outputs.txt"
    - name: Upload shared STANDARD resolver observations
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: candidate-standard-acceptance-context-${{ job.status }}
        path: ${{ runner.temp }}/acceptance-context-resources/
        retention-days: ${{ job.status == 'success' && 7 || 14 }}
        compression-level: 6
        if-no-files-found: warn

  onnxruntime-web-smoke:
    needs: acceptance-context
    if: needs.acceptance-context.outputs.full_acceptance == 'true' || needs.acceptance-context.outputs.routine_activated != 'true'
    name: onnxruntime-web smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.acceptance-context.outputs.head_sha }}

    - name: Verify checked-out commit
      env:
        EXPECTED_CHECKOUT_SHA: ${{ needs.acceptance-context.outputs.head_sha }}
      run: |
        set -eu
        expected_commit="$(git rev-parse --verify "${EXPECTED_CHECKOUT_SHA}^{commit}")"
        actual_commit="$(git rev-parse --verify 'HEAD^{commit}')"
        echo "checked-out commit: ${actual_commit}"
        echo "expected commit: ${expected_commit}"
        test "$actual_commit" = "$expected_commit"

    - name: Set up Python 3.12
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: npm

    - name: Install Poetry
      run: pip install "poetry>=2.0,<3.0"

    - name: Install Python dependencies
      run: poetry install --no-interaction

    - name: Install Node dependencies
      run: npm ci

    - name: Generate tests
      run: poetry run python scripts/generate_tests.py

    - name: Run onnxruntime-web smoke checks
      run: scripts/run_onnxruntime_web_smoke.sh

  minimum-dependencies:
    needs: acceptance-context
    name: minimum dependency versions (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.acceptance-context.outputs.head_sha }}

    - name: Verify checked-out commit
      env:
        EXPECTED_CHECKOUT_SHA: ${{ needs.acceptance-context.outputs.head_sha }}
      run: |
        set -eu
        expected_commit="$(git rev-parse --verify "${EXPECTED_CHECKOUT_SHA}^{commit}")"
        actual_commit="$(git rev-parse --verify 'HEAD^{commit}')"
        echo "checked-out commit: ${actual_commit}"
        echo "expected commit: ${expected_commit}"
        test "$actual_commit" = "$expected_commit"

    - name: Set up Python 3.11
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Observe minimum-version setup and compatibility checks
      env:
        EXPECTED_CHECKOUT_SHA: ${{ needs.acceptance-context.outputs.head_sha }}
      run: |
        set -euo pipefail
        python -B scripts/run_with_resources.py \
          --output-dir "$RUNNER_TEMP/minimum311-work-resources" \
          --timeout-seconds 1100 --max-rss-mib 4096 --min-available-mib 2048 \
          --min-disk-free-mib 4096 --disk-path "$RUNNER_TEMP" --disk-path "$GITHUB_WORKSPACE" -- \
          bash -euo pipefail - <<'BASH_MINIMUM'
        set -euo pipefail
        exec > >(tee "$RUNNER_TEMP/minimum311-controlled.log") 2>&1
        mkdir -m 700 "$RUNNER_TEMP/minimum311-tmp"
        export TMPDIR="$RUNNER_TEMP/minimum311-tmp"
        printf 'Minimum311 exact acceptance commit: %s\n' "$EXPECTED_CHECKOUT_SHA"
        pip install "poetry>=2.0,<3.0"
        poetry install --no-interaction
        poetry run python scripts/install_minimum_dependencies.py
        poetry run pip check
        poetry run python - <<'PY'
        import platform
        import sys

        import flax
        import jax
        import jaxlib
        import onnx
        import onnx_ir
        import onnxruntime

        expected = {"jax": "0.10.2", "jaxlib": "0.10.2", "flax": "0.12.8"}
        actual = {
            "jax": jax.__version__,
            "jaxlib": jaxlib.__version__,
            "flax": flax.__version__,
        }
        print(f"python=={platform.python_version()}")
        for package, version in actual.items():
            print(f"{package}=={version}")
        if sys.version_info[:2] != (3, 11):
            raise SystemExit("Minimum-dependency CI requires Python 3.11")
        if actual != expected:
            raise SystemExit(
                f"Expected declared framework minimums {expected}; resolved {actual}"
            )
        print(f"onnx=={onnx.__version__}")
        print(f"onnx-ir=={onnx_ir.__version__}")
        print(f"onnxruntime=={onnxruntime.__version__}")
        PY
        poetry run pip list --format=json > "$RUNNER_TEMP/minimum311-installed-packages.json"
        poetry run python scripts/generate_tests.py
        JAX_PLATFORMS=cpu JAX_ENABLE_X64=True poetry run pytest -q \
          --junitxml "$RUNNER_TEMP/minimum311-junit.xml" \
          tests/extra_tests/framework/test_jax_compat.py \
          tests/extra_tests/framework/test_minimum_dependency_installer.py \
          tests/extra_tests/framework/test_onnx_ir_surface.py \
          tests/extra_tests/converter/test_onnx_function_if_captures.py \
          tests/extra_tests/converter/test_onnx_function_transformed_captures.py \
          tests/extra_tests/converter/test_onnx_function_static_captures.py \
          tests/extra_tests/converter/test_onnx_function_loop_call_params.py \
          tests/extra_tests/converter/test_typed_builder.py \
          tests/extra_tests/converter/test_context_typing_compat.py \
          tests/extra_tests/converter/test_native_context_typing.py \
          tests/extra_tests/converter/test_native_function_scope.py \
          tests/extra_tests/loop/test_fori_loop_captures.py \
          tests/primitives/test_linen.py \
          tests/extra_tests/test_bfloat16_capability_matrix.py \
          tests/extra_tests/test_cos_precision.py \
          tests/extra_tests/test_float16_cpu_inference.py \
          tests/extra_tests/test_log1p_expm1_precision.py
        BASH_MINIMUM

    - name: Upload minimum311 STANDARD receipts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: candidate-standard-minimum311-${{ job.status }}
        path: |
          ${{ runner.temp }}/minimum311-work-resources/
          ${{ runner.temp }}/minimum311-controlled.log
          ${{ runner.temp }}/minimum311-junit.xml
          ${{ runner.temp }}/minimum311-installed-packages.json
        retention-days: ${{ job.status == 'success' && 7 || 14 }}
        compression-level: 6
        if-no-files-found: warn

    - name: Preserve complete minimum311 failure models and temporary outputs
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: candidate-standard-minimum311-failure-payloads
        path: |
          ${{ github.workspace }}/onnx/
          ${{ runner.temp }}/minimum311-tmp/
        include-hidden-files: true
        retention-days: 14
        compression-level: 0
        if-no-files-found: warn

  normalization-accuracy:
    needs: acceptance-context
    if: needs.acceptance-context.outputs.full_acceptance == 'true' || needs.acceptance-context.outputs.routine_activated != 'true'
    name: normalization accuracy (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Python 3.12 resolves the JAX 0.10 stack, 3.13 the JAX 0.12 stack.
        python-version: ['3.12', '3.13']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.acceptance-context.outputs.head_sha }}

    - name: Verify checked-out commit
      env:
        EXPECTED_CHECKOUT_SHA: ${{ needs.acceptance-context.outputs.head_sha }}
      run: |
        set -eu
        expected_commit="$(git rev-parse --verify "${EXPECTED_CHECKOUT_SHA}^{commit}")"
        actual_commit="$(git rev-parse --verify 'HEAD^{commit}')"
        echo "checked-out commit: ${actual_commit}"
        echo "expected commit: ${expected_commit}"
        test "$actual_commit" = "$expected_commit"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      run: pip install "poetry>=2.0,<3.0"

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Report reference profile
      run: |
        {
          echo "### Normalization accuracy profile (Python ${{ matrix.python-version }})"
          echo '```'
          echo "checked-out commit: $(git rev-parse HEAD)"
          echo "event commit: ${GITHUB_SHA}"
          echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          lscpu | grep -E '^(Model name|Architecture|CPU\(s\)|Flags):'
          poetry run python - <<'PY'
        from importlib.metadata import version
        import platform

        import onnxruntime as ort

        print(f"python=={platform.python_version()}")
        for package in (
            "numpy", "scipy", "jax", "jaxlib", "flax", "equinox",
            "onnx", "onnx-ir", "onnxruntime",
        ):
            print(f"{package}=={version(package)}")
        print(f"onnxruntime available providers: {ort.get_available_providers()}")
        PY
          echo 'gate: test_layer_norm_precision.py and test_cos_precision.py; JAX_PLATFORMS=cpu'
          echo 'locked LayerNorm cases: eqx, nnx_slow, nnx_fast, linen; auto, force_decomposed, prefer_native'
          echo 'locked LayerNorm input: float32 [257, 384], seed 0, epsilon 1e-5, ONNX opset 23'
          echo 'locked LayerNorm runtime: CPUExecutionProvider; ORT_ENABLE_ALL and ORT_DISABLE_ALL'
          echo 'locked comparisons: maximum absolute error versus independent two-pass float64 reference and JAX output'
          echo '```'
        } | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Run normalization accuracy gate
      env:
        JAX_PLATFORMS: cpu
      run: |
        poetry run pytest -q \
          tests/extra_tests/test_layer_norm_precision.py \
          tests/extra_tests/test_cos_precision.py

  test:
    needs: acceptance-context
    if: needs.acceptance-context.outputs.full_acceptance == 'true' || needs.acceptance-context.outputs.routine_activated != 'true'
    runs-on: ubuntu-latest
    env:
      PYTEST_ADDOPTS: '-v --tb=short -x'
      JAX2ONNX_TEST_CI_LANE_XDIST: '1'
      JAX2ONNX_RUN_FIXED_PARTS_SMOKE: '1'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.acceptance-context.outputs.head_sha }}

    - name: Verify checked-out commit
      env:
        EXPECTED_CHECKOUT_SHA: ${{ needs.acceptance-context.outputs.head_sha }}
      run: |
        set -eu
        expected_commit="$(git rev-parse --verify "${EXPECTED_CHECKOUT_SHA}^{commit}")"
        actual_commit="$(git rev-parse --verify 'HEAD^{commit}')"
        echo "checked-out commit: ${actual_commit}"
        echo "expected commit: ${expected_commit}"
        test "$actual_commit" = "$expected_commit"

    - name: Fetch frozen original SOURCE history
      env:
        EXPECTED_CHECKOUT_SHA: ${{ needs.acceptance-context.outputs.head_sha }}
      run: |
        set -euo pipefail
        source_anchor=ccc861b0dff5042958a267addc43b622a4b61d49
        source_head="$(git rev-parse --verify 'HEAD^{commit}')"
        test "$source_head" = "$EXPECTED_CHECKOUT_SHA"
        git fetch --no-tags --depth=1 origin "$source_anchor"
        test "$(git rev-parse --verify 'ccc861b0^{commit}')" = "$source_anchor"
        git archive "$source_anchor" tests > /dev/null
        test "$(git rev-parse --verify 'HEAD^{commit}')" = "$source_head"
        test -z "$(git status --porcelain --untracked-files=no)"
        printf 'Frozen SOURCE history: %s; checked-out head: %s\n' "$source_anchor" "$source_head"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      run: pip install "poetry>=2.0,<3.0"

    - name: Install dependencies
      run: |
        poetry install --no-interaction
        poetry run pip install pytest-xdist

    - name: Verify locked JAX 0.12 stack
      if: matrix.python-version == '3.13' || matrix.python-version == '3.14'
      run: |
        poetry run python - <<'PY'
        from importlib.metadata import version
        import sys

        from packaging.version import Version

        expected_version = Version("0.12.0.1")
        resolved = {
            package: Version(version(package))
            for package in ("jax", "jaxlib")
        }
        wrong = {
            package: str(package_version)
            for package, package_version in resolved.items()
            if package_version != expected_version
        }

        if wrong:
            raise SystemExit(
                "The locked modern test stack must resolve jax and jaxlib "
                f"to {expected_version} on Python {sys.version_info.major}."
                f"{sys.version_info.minor}; resolved {wrong}. "
                "If this is an intentional JAX upgrade, update this guard "
                "and the compatibility coverage in the same PR."
            )

        print(
            "Verified locked modern stack: "
            + ", ".join(f"{name}=={value}" for name, value in resolved.items())
        )
        PY

    - name: Report runner CPU profile
      run: LC_ALL=C lscpu

    - name: Report native AxisData compatibility metadata
      run: poetry run python -B scripts/observe_native_axisdata.py

    - name: Run full checks (with MaxText and MaxDiffusion)
      if: matrix.python-version == '3.12'
      env:
        JAX2ONNX_RUN_MAXTEXT: "1"
        JAX2ONNX_RUN_MAXDIFFUSION: "1"
      run: ./scripts/run_all_checks.sh

    - name: Run full checks
      if: matrix.python-version != '3.12'
      env:
        JAX2ONNX_RUN_MAXTEXT: "0"
        JAX2ONNX_MAXTEXT_SRC: ""
        JAX2ONNX_MAXTEXT_MODELS: ""
        JAX2ONNX_RUN_MAXDIFFUSION: "0"
        JAX2ONNX_MAXDIFFUSION_SRC: ""
        JAX2ONNX_MAXDIFFUSION_MODELS: ""
      run: ./scripts/run_all_checks.sh

    - name: Control observer necessity after an original cast failure
      if: failure()
      timeout-minutes: 5
      run: |
        poetry run python -B scripts/control_source_cast_observer.py \
          --receipts-dir "$RUNNER_TEMP/jax2onnx-pytest-batches"

    - name: Replay frozen references after an original cast failure
      if: failure()
      timeout-minutes: 5
      run: |
        poetry run python -B scripts/replay_source_cast_failure.py \
          --receipts-dir "$RUNNER_TEMP/jax2onnx-pytest-batches"

    - name: Upload bounded native TopK capture
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: source-bf16-topk-native-python-${{ matrix.python-version }}
        path: ${{ runner.temp }}/jax2onnx-pytest-batches/batch-*/source-bf16-topk-native/
        retention-days: 14
        if-no-files-found: ignore

    - name: Upload full-suite pytest receipts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: pytest-receipts-python-${{ matrix.python-version }}
        path: ${{ runner.temp }}/jax2onnx-pytest-batches
        if-no-files-found: warn

    - name: Upload hosted download-cache preparation report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ci-download-cache-preparation-python-${{ matrix.python-version }}
        path: ${{ runner.temp }}/ci-download-cache-preparation.json
        if-no-files-found: ignore


  # Qualification keeps original owners and all focused rows alongside new
  # owners. After independent acceptance, the tracked switch enables routine
  # scheduling and full acceptance suppresses duplicate focused bodies.
  # Locked311/312/313/314 STANDARD close only through their fixed joins below.
  candidate-standard:
    name: candidate ${{ matrix.scope == 'all' && 'support EXTRA all' || matrix.lane == 'extra' && 'focused EXTRA' || 'STANDARD' }} (${{ matrix.label || matrix.id }})
    needs: acceptance-context
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.scope == 'focused' && 35 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - {id: locked311-a, part: a, python: '3.11', cohort: py311-owners, role: locked, label: 'locked311 serial part a'}
        - {id: locked311-b, part: b, python: '3.11', cohort: py311-owners, role: locked, label: 'locked311 serial part b'}
        - {id: locked312-a, part: a, python: '3.12', cohort: py312-owners, role: locked, label: 'locked312 serial part a (5GiB)'}
        - {id: locked312-b, part: b, python: '3.12', cohort: py312-owners, role: locked, label: 'locked312 serial part b (5GiB)'}
        - {id: locked313-a, part: a, python: '3.13', cohort: py313-owners, role: locked, label: 'locked313 serial part a'}
        - {id: locked313-b, part: b, python: '3.13', cohort: py313-owners, role: locked, label: 'locked313 serial part b'}
        - {id: locked314-a, part: a, python: '3.14', cohort: py314-owners, role: locked, label: 'locked314 serial part a'}
        - {id: locked314-b, part: b, python: '3.14', cohort: py314-owners, role: locked, label: 'locked314 serial part b'}
        - {id: minimum312, python: '3.12', cohort: minimum312, role: minimum}
        - {id: minimum312-extra, python: '3.12', cohort: minimum312, role: minimum, lane: extra, scope: all}
        - {id: normalization312, python: '3.12', cohort: normalization312, role: normalization}
        - {id: normalization313, python: '3.13', cohort: normalization313, role: normalization}
        - {id: node312, python: '3.12', cohort: node312, role: node-smoke}
        - {id: focused311, python: '3.11', cohort: py311-extra, role: locked, lane: extra, scope: focused}
        - {id: focused312, python: '3.12', cohort: py312-extra, role: locked, lane: extra, scope: focused}
        - {id: focused313, python: '3.13', cohort: py313-extra, role: locked, lane: extra, scope: focused}
        - {id: focused314, python: '3.14', cohort: py314-extra, role: locked, lane: extra, scope: focused}
    env:
      EXPECTED_CHECKOUT_SHA: ${{ needs.acceptance-context.outputs.head_sha }}
      CANDIDATE_ID: ${{ matrix.id }}
      CANDIDATE_PART: ${{ matrix.part || '' }}
      CANDIDATE_ROLE: ${{ matrix.role }}
      CANDIDATE_LANE: ${{ matrix.lane || 'standard' }}
      CANDIDATE_SCOPE: ${{ matrix.scope || '' }}
      CANDIDATE_COHORT: internal_docs/precision/ci_standard/${{ matrix.cohort }}.json

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: matrix.scope != 'focused' || needs.acceptance-context.outputs.full_acceptance != 'true' || needs.acceptance-context.outputs.routine_activated != 'true'
      with:
        ref: ${{ needs.acceptance-context.outputs.head_sha }}

    - name: Set up Python ${{ matrix.python }}
      if: matrix.scope != 'focused' || needs.acceptance-context.outputs.full_acceptance != 'true' || needs.acceptance-context.outputs.routine_activated != 'true'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python }}

    - name: Observe original setup and canonical lane execution
      if: matrix.scope != 'focused' || needs.acceptance-context.outputs.full_acceptance != 'true' || needs.acceptance-context.outputs.routine_activated != 'true'
      id: work
      env:
        CANDIDATE_DIR: ${{ runner.temp }}/ci-candidate-${{ matrix.id }}
        CANDIDATE_TOOLS: ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-tools
        CANDIDATE_VENV: ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-venv
        CANDIDATE_NODE_PARENT: ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-node
        CANDIDATE_TMP: ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-tmp
      run: |
        set -euo pipefail
        execution_rss_mib=4096
        live_available_mib=2048
        execution_work_seconds=1100
        execution_profile_args=()
        if [[ "$CANDIDATE_ID" == locked312-a || "$CANDIDATE_ID" == locked312-b ]]; then
          # Each serial part uses the approved hosted locked312 envelope.
          test "$CANDIDATE_ID" = "locked312-$CANDIDATE_PART"
          python -B -c 'from pathlib import Path; import sys; available = next(int(line.split()[1]) * 1024 for line in Path("/proc/meminfo").read_text().splitlines() if line.startswith("MemAvailable:")); print("locked312 initial available bytes:", available); sys.exit(0 if available >= 12288 * 1024 * 1024 else "locked312 needs 12 GiB initially available")'
          execution_rss_mib=5120
          live_available_mib=8192
          execution_profile_args=(--locked312-standard-profile "$CANDIDATE_COHORT")
        elif [[ "$CANDIDATE_ID" == focused311 || "$CANDIDATE_ID" == focused312 || "$CANDIDATE_ID" == focused313 || "$CANDIDATE_ID" == focused314 ]]; then
          test "$CANDIDATE_ROLE" = locked
          test "$CANDIDATE_LANE" = extra
          test "$CANDIDATE_SCOPE" = focused
          test -z "$CANDIDATE_PART"
          execution_work_seconds=2000
          execution_profile_args=(--focused-extra-profile "$CANDIDATE_COHORT")
        fi
        python -B scripts/run_with_resources.py \
          "${execution_profile_args[@]}" \
          --output-dir "${CANDIDATE_DIR}-work-resources" --timeout-seconds "$execution_work_seconds" \
          --max-rss-mib "$execution_rss_mib" --min-available-mib "$live_available_mib" \
          --min-disk-free-mib 4096 \
          --disk-path "$RUNNER_TEMP" --disk-path "$GITHUB_WORKSPACE" -- \
          bash -euo pipefail - <<'BASH'
        mkdir "$CANDIDATE_DIR"
        mkdir "$CANDIDATE_DIR/setup-diagnostics"
        exec > >(tee "$CANDIDATE_DIR/controlled.log") 2>&1
        cleanup() {
          result=$?
          trap - EXIT
          printf '%s\n' "$result" > "$CANDIDATE_DIR/controlled-exit-code.txt"
          # Preserve setup diagnostics before removing their owning trees. On a
          # failed copy, retain the originals for the raw failure upload instead.
          retained=0
          for diagnostic in "$CANDIDATE_NODE_PARENT/npm-cache/_logs" \
            "$CANDIDATE_NODE_PARENT/config"; do
            if [[ -e "$diagnostic" || -L "$diagnostic" ]]; then
              cp -a -- "$diagnostic" "$CANDIDATE_DIR/setup-diagnostics/" || retained=$?
            fi
          done
          if [[ "$retained" == 0 ]]; then
            # Canonical source/context closure precedes successful cleanup.
            # Model outputs, private TMPDIR and receipts are never removed here.
            rm -rf -- "$CANDIDATE_TOOLS" "$CANDIDATE_VENV" \
              "$CANDIDATE_NODE_PARENT" || retained=$?
            # Retain original optional sources through uploads: a later primary,
            # packing, or upload failure must still preserve their complete bytes.
          fi
          printf '%s\n' "$retained" > "$CANDIDATE_DIR/setup-diagnostics/retention-exit-code.txt"
          if [[ "$result" == 0 && "$retained" != 0 ]]; then result=$retained; fi
          exit "$result"
        }
        trap cleanup EXIT
        # Linux tempfile/pytest FD capture and default basetemp inherit this
        # fresh owned directory. Keep ordinary checkout/onnx as a real directory.
        mkdir -m 700 "$CANDIDATE_TMP"
        export TMPDIR="$CANDIDATE_TMP"
        test -f "$CANDIDATE_COHORT"
        expected_commit="$(git rev-parse --verify "${EXPECTED_CHECKOUT_SHA}^{commit}")"
        actual_commit="$(git rev-parse --verify 'HEAD^{commit}')"
        test "$actual_commit" = "$expected_commit"
        printf 'expected commit: %s\nchecked-out commit: %s\nevent commit: %s\n' \
          "$EXPECTED_CHECKOUT_SHA" "$actual_commit" "$GITHUB_SHA" \
          > "$CANDIDATE_DIR/checkout.txt"
        LC_ALL=C lscpu > "$CANDIDATE_DIR/cpu.txt"
        printf '%s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" \
          > "$CANDIDATE_DIR/runner-image.txt"
        test ! -e tests/primitives && test ! -L tests/primitives
        test ! -e tests/examples && test ! -L tests/examples

        # Render only the tracked profile's declared values and existing slots.
        # Explicit SOURCE diagnostics require the frozen original tests archive.
        # Keep the existing STANDARD/support/join preparation unchanged.
        if [[ "$CANDIDATE_LANE" == extra && "$CANDIDATE_ROLE" == locked ]]; then
          source_anchor=ccc861b0dff5042958a267addc43b622a4b61d49
          source_head="$(git rev-parse --verify 'HEAD^{commit}')"
          test "$source_head" = "$EXPECTED_CHECKOUT_SHA"
          git fetch --no-tags --depth=1 origin "$source_anchor"
          test "$(git rev-parse --verify 'ccc861b0^{commit}')" = "$source_anchor"
          git archive "$source_anchor" tests > /dev/null
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$source_head"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'Frozen SOURCE history: %s; checked-out head: %s\n' "$source_anchor" "$source_head"
        fi

        # Genuine absence, original plugin autoload and TF transitions matter.
        python -B - <<'PY' > "$CANDIDATE_DIR/profile.env"
        import json
        import os
        from pathlib import Path
        import shlex

        profile = json.loads(Path(os.environ["CANDIDATE_COHORT"]).read_text())
        slots = {
            "${CHECKOUT}": os.environ["GITHUB_WORKSPACE"],
            "${MAXTEXT_SOURCE}": os.environ["CANDIDATE_DIR"] + "/optional-sources/maxtext",
            "${MAXDIFFUSION_SOURCE}": os.environ["CANDIDATE_DIR"] + "/optional-sources/maxdiffusion",
        }
        print("unset TF_CPP_MIN_LOG_LEVEL PYTEST_VERSION JAX2ONNX_NATIVE_BINDINGS_EVIDENCE_DIR")
        for name, value in profile["environment"].items():
            if name == "JAX2ONNX_NATIVE_BINDINGS_EVIDENCE_DIR":
                continue
            if value is None:
                print("unset " + name)
            else:
                print("export " + name + "=" + shlex.quote(slots.get(value, value)))
        print("export CANDIDATE_BOOTSTRAP_PIP=" + shlex.quote(profile["bootstrap"]["pip"]))
        if os.environ["CANDIDATE_ROLE"] == "node-smoke":
            for name, value in profile["node_runtime"]["environment"].items():
                if value is None:
                    print("unset " + name)
                else:
                    value = value.replace("${NODE_PREFIX_PARENT}", os.environ["CANDIDATE_NODE_PARENT"])
                    print("export " + name + "=" + shlex.quote(value))
            # Smoke's original generator has no runtime validation flags.
            print("unset JAX2ONNX_VALIDATE_ONNXRUNTIME_WEB JAX2ONNX_ONNXRUNTIME_WEB_RUNNER")
        PY
        source "$CANDIDATE_DIR/profile.env"

        # Poetry lives outside the admitted project environment. No package from
        # the tool environment may satisfy the complete cohort package/plugin map.
        python -m venv "$CANDIDATE_TOOLS"
        "$CANDIDATE_TOOLS/bin/python" -m pip install 'poetry>=2.0,<3.0'
        python -m venv --without-pip "$CANDIDATE_VENV"
        "$CANDIDATE_TOOLS/bin/python" -m pip --python "$CANDIDATE_VENV/bin/python" \
          install "pip==$CANDIDATE_BOOTSTRAP_PIP"
        export VIRTUAL_ENV="$CANDIDATE_VENV"
        export PATH="$CANDIDATE_VENV/bin:$CANDIDATE_TOOLS/bin:$PATH"
        export POETRY_VIRTUALENVS_CREATE=false
        poetry --version > "$CANDIDATE_DIR/poetry-version.txt"
        poetry install --no-interaction

        # Preserve Main's pinned all-files quality check at its base-lock point.
        # Part a owns it once per split cohort; b retains the same pytest context.
        # Setup, hooks and their failures count toward this monitored WORK/job.
        if [[ "$CANDIDATE_LANE" == standard && "$CANDIDATE_ROLE" == locked && "$CANDIDATE_PART" != b ]]; then
          poetry run python scripts/ensure_path_markers.py --fix
          poetry run pre-commit run --all-files
        fi

        if [[ "$CANDIDATE_ID" == locked312-a || "$CANDIDATE_ID" == locked312-b || "$CANDIDATE_ID" == focused312 ]]; then
          mkdir "$CANDIDATE_DIR/optional-sources"
          for integration in MAXTEXT MAXDIFFUSION; do
            source_name="JAX2ONNX_${integration}_SRC"
            ref_name="JAX2ONNX_${integration}_REF"
            source_dir="${!source_name}"
            git init "$source_dir"
            if [[ "$integration" == MAXTEXT ]]; then
              remote=https://github.com/AI-Hypercomputer/maxtext.git
              group=maxtext
            else
              remote=https://github.com/google/maxdiffusion.git
              group=maxdiffusion
            fi
            git -C "$source_dir" remote add origin "$remote"
            git -C "$source_dir" fetch --depth 1 origin "${!ref_name}"
            git -C "$source_dir" checkout --detach FETCH_HEAD
            test "$(git -C "$source_dir" rev-parse HEAD)" = "${!ref_name}"
            test -z "$(git -C "$source_dir" status --porcelain)"
            poetry install --no-interaction --with "$group"
          done
        fi
        if [[ "$CANDIDATE_ROLE" == minimum ]]; then
          python scripts/install_minimum_dependencies.py
          python -m pip check
        fi
        python -m pip list --format=json > "$CANDIDATE_DIR/installed-packages.json"
        if [[ "$CANDIDATE_ROLE" == locked ]]; then
          python -B scripts/observe_native_axisdata.py > "$CANDIDATE_DIR/native-axisdata.json"
        fi

        render_args=()
        if [[ "$CANDIDATE_ID" == locked312-a || "$CANDIDATE_ID" == locked312-b || "$CANDIDATE_ID" == focused312 ]]; then
          render_args+=(--maxtext-source "$JAX2ONNX_MAXTEXT_SRC" \
            --maxdiffusion-source "$JAX2ONNX_MAXDIFFUSION_SRC")
        fi
        if [[ "$CANDIDATE_ROLE" == node-smoke ]]; then
          test "$(uname -m)" = x86_64
          mkdir -p "$CANDIDATE_NODE_PARENT/config"
          : > "$CANDIDATE_NODE_PARENT/config/user.npmrc"
          : > "$CANDIDATE_NODE_PARENT/config/global.npmrc"
          archive="$CANDIDATE_NODE_PARENT/node-v22.23.4-linux-x64.tar.xz"
          curl --fail --location --retry 2 \
            https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-x64.tar.xz \
            --output "$archive"
          printf '%s  %s\n' \
            1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce \
            "$archive" | sha256sum --check --status
          tar -xJf "$archive" -C "$CANDIDATE_NODE_PARENT"
          node_prefix="$CANDIDATE_NODE_PARENT/node-v22.23.4-linux-x64"
          export PATH="$node_prefix/bin:$PATH"
          npm ci
          render_args+=(--node-prefix "$node_prefix")
        fi

        if [[ "$CANDIDATE_ROLE" != normalization ]]; then
          # Exactly one original generation for this environment (26 or 28 files).
          python scripts/generate_tests.py
        else
          test ! -e tests/primitives && test ! -L tests/primitives
          test ! -e tests/examples && test ! -L tests/examples
        fi
        if [[ "$CANDIDATE_ROLE" == node-smoke ]]; then
          export JAX2ONNX_VALIDATE_ONNXRUNTIME_WEB=1
          export JAX2ONNX_ONNXRUNTIME_WEB_RUNNER=node
        fi
        if [[ "$CANDIDATE_LANE" == standard && "$CANDIDATE_ROLE" == locked ]]; then
          render_args+=(--collection-scope main-owners)
        fi
        if [[ -n "$CANDIDATE_PART" ]]; then
          render_args+=(--ci-standard-part "$CANDIDATE_PART")
        fi
        python -B scripts/prepare_ci_standard.py \
          --cohort "$CANDIDATE_COHORT" --event-sha "$EXPECTED_CHECKOUT_SHA" \
          --run-dir "$CANDIDATE_DIR/run" --output "$CANDIDATE_DIR/main.json" \
          "${render_args[@]}"
        # Repeat the original support selectors literally and in their own order.
        mapfile -t selectors < <(python -B - <<'PY'
        import json
        import os
        from pathlib import Path

        for selector in json.loads(Path(os.environ["CANDIDATE_COHORT"]).read_text()).get("collection_args", []):
            print(selector)
        PY
        )
        selection_args=()
        for selector in "${selectors[@]}"; do
          selection_args+=(--test-path "$selector")
        done
        if [[ "$CANDIDATE_ID" == locked312-a || "$CANDIDATE_ID" == locked312-b ]]; then
          python -B - <<'PY_CAPACITY'
        import json
        import os
        from pathlib import Path

        available = next(int(line.split()[1]) * 1024 for line in Path("/proc/meminfo").read_text().splitlines() if line.startswith("MemAvailable:"))
        required = 12288 * 1024 * 1024
        Path(os.environ["CANDIDATE_DIR"], "standard-start-capacity.json").write_text(json.dumps({"available_bytes": available, "required_bytes": required, "execution_rss_mib": 5120, "standard_acceptance_rss_mib": 5120, "part": os.environ["CANDIDATE_PART"]}) + "\n")
        if available < required:
            raise SystemExit("locked312 requires at least 12 GiB available before work")
        PY_CAPACITY
        fi
        part_args=()
        if [[ -n "$CANDIDATE_PART" ]]; then
          part_args=(--ci-standard-part "$CANDIDATE_PART")
        fi
        if [[ "$CANDIDATE_ID" == minimum312-extra ]]; then
          test "$CANDIDATE_LANE" = extra
          test "$CANDIDATE_ROLE" = minimum
          test "$CANDIDATE_SCOPE" = all
          test -z "$CANDIDATE_PART"
          test "$CANDIDATE_COHORT" = internal_docs/precision/ci_standard/minimum312.json
        fi
        lane_args=(--ci-lane "$CANDIDATE_LANE")
        if [[ "$CANDIDATE_LANE" == extra ]]; then
          test -z "$CANDIDATE_PART"
          if [[ "$CANDIDATE_SCOPE" == focused ]]; then
            test "$CANDIDATE_ROLE" = locked
            case "$CANDIDATE_ID" in focused311|focused312|focused313|focused314) ;; *) exit 2 ;; esac
          else
            test "$CANDIDATE_ID" = minimum312-extra
            test "$CANDIDATE_ROLE" = minimum
            test "$CANDIDATE_SCOPE" = all
            test "$CANDIDATE_COHORT" = internal_docs/precision/ci_standard/minimum312.json
          fi
          lane_args+=(--ci-extra-scope "$CANDIDATE_SCOPE")
        fi
        python -B scripts/run_pytest_batches.py "${part_args[@]}" \
          --batch-size 500 --output-dir "$CANDIDATE_DIR/run" \
          "${lane_args[@]}" --ci-main-baseline "$CANDIDATE_DIR/main.json" \
          --_ci-provision-campaign "$CANDIDATE_COHORT" "${selection_args[@]}" \
          -- --durations=50 --durations-min=1
        if [[ "$CANDIDATE_ROLE" == normalization ]]; then
          test ! -e tests/primitives && test ! -L tests/primitives
          test ! -e tests/examples && test ! -L tests/examples
        fi
        BASH

    - name: Upload primary canonical results before bulk packing
      id: primary
      if: (matrix.scope != 'focused' || needs.acceptance-context.outputs.full_acceptance != 'true' || needs.acceptance-context.outputs.routine_activated != 'true') && (always())
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ matrix.lane == 'extra' && 'candidate-extra-primary' || 'candidate-primary' }}-${{ matrix.id }}-${{ job.status }}
        path: |
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-work-resources/summary.json
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}/standard-start-capacity.json
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}/run/run.json
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}/run/primary/
        retention-days: ${{ job.status == 'success' && 7 || 14 }}
        compression-level: 6
        if-no-files-found: warn

    - name: Observe output inventory and evidence compression
      id: pack
      if: (matrix.scope != 'focused' || needs.acceptance-context.outputs.full_acceptance != 'true' || needs.acceptance-context.outputs.routine_activated != 'true') && (always())
      env:
        CANDIDATE_DIR: ${{ runner.temp }}/ci-candidate-${{ matrix.id }}
        CANDIDATE_TOOLS: ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-tools
        CANDIDATE_VENV: ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-venv
        CANDIDATE_NODE_PARENT: ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-node
        CANDIDATE_TMP: ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-tmp
        CANDIDATE_PRIOR_STATUS: ${{ job.status }}
        CANDIDATE_PRIMARY_OUTCOME: ${{ steps.primary.outcome }}
      run: |
        set -euo pipefail
        python -B scripts/run_with_resources.py \
          --output-dir "${CANDIDATE_DIR}-pack-resources" --timeout-seconds 90 \
          --disk-path "$RUNNER_TEMP" --disk-path "$GITHUB_WORKSPACE" -- \
          bash -euo pipefail - <<'BASH'
        mkdir -p "$CANDIDATE_DIR/setup-diagnostics"
        # This starts after canonical closure (or the actual failed work exit).
        # Stream the complete retained inventory with bounded hashing memory;
        # successful receipts do not carry every ordinary generated model/temp.
        python -B - <<'PY'
        import hashlib
        import json
        import os
        from pathlib import Path
        import stat

        evidence = Path(os.environ["CANDIDATE_DIR"])
        roots = {
            "checkout/onnx": Path(os.environ["GITHUB_WORKSPACE"]) / "onnx",
            "owned-tmp": Path(os.environ["CANDIDATE_TMP"]),
            "setup-diagnostics": evidence / "setup-diagnostics",
        }
        with (evidence / "retained-output-inventory.jsonl").open("x") as output:
            for label, root in roots.items():
                output.write(json.dumps({"root": label, "path": str(root), "exists": os.path.lexists(root)}) + "\n")
                if not os.path.lexists(root):
                    continue
                pending = [root]
                while pending:
                    path = pending.pop()
                    before = path.lstat()
                    row = {"root": label, "path": path.relative_to(root).as_posix(), "bytes": before.st_size}
                    if stat.S_ISLNK(before.st_mode):
                        row.update(type="symlink", target=os.readlink(path))
                    elif stat.S_ISDIR(before.st_mode):
                        row["type"] = "directory"
                        pending.extend(sorted(path.iterdir(), reverse=True))
                    elif stat.S_ISREG(before.st_mode):
                        digest = hashlib.sha256()
                        with path.open("rb") as stream:
                            while chunk := stream.read(1024 * 1024):
                                digest.update(chunk)
                        after = path.lstat()
                        if (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns) != (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns):
                            raise RuntimeError("retained output changed during inventory: " + str(path))
                        row.update(type="file", sha256=digest.hexdigest())
                    else:
                        row.update(type="special", mode=before.st_mode)
                    output.write(json.dumps(row) + "\n")
        PY
        paths=()
        for path in "$CANDIDATE_DIR" "${CANDIDATE_DIR}-work-resources"; do
          if [[ -e "$path" ]]; then
            paths+=("$(basename "$path")")
          fi
        done
        # Keep complete optional-source originals in failure evidence, while the
        # routine receipt archive contains their pinned identities and receipts.
        tar --exclude="$(basename "$CANDIDATE_DIR")/optional-sources" \
          -czf "${CANDIDATE_DIR}.tar.gz" -C "$RUNNER_TEMP" "${paths[@]}"
        if [[ "$CANDIDATE_PRIOR_STATUS" != success || "$CANDIDATE_PRIMARY_OUTCOME" != success ]]; then
          # Failure payloads have their own artifact and accounting, with no size
          # truncation. A failed/incomplete pack instead triggers the raw fallback.
          payloads=()
          for path in "$GITHUB_WORKSPACE/onnx" "$CANDIDATE_TMP" "$CANDIDATE_DIR/optional-sources" \
            "$CANDIDATE_DIR/setup-diagnostics" \
            "$CANDIDATE_NODE_PARENT/npm-cache/_logs" "$CANDIDATE_NODE_PARENT/config"; do
            if [[ -e "$path" || -L "$path" ]]; then
              payloads+=(-C "$(dirname "$path")" "$(basename "$path")")
            fi
          done
          tar -czf "${CANDIDATE_DIR}-failure-payloads.tar.gz" "${payloads[@]}"
        fi
        python -B - <<'PY'
        import json
        import os
        from pathlib import Path

        archive = Path(os.environ["CANDIDATE_DIR"] + ".tar.gz")
        failure = Path(os.environ["CANDIDATE_DIR"] + "-failure-payloads.tar.gz")
        extra = os.environ["CANDIDATE_LANE"] == "extra"
        focused_extra = extra and os.environ["CANDIDATE_SCOPE"] == "focused"
        accounting = {
            "candidate": os.environ["CANDIDATE_ID"],
            "campaign_family": "EXTRA" if extra else "STANDARD",
            "ci_lane": os.environ["CANDIDATE_LANE"],
            "ci_extra_scope": os.environ.get("CANDIDATE_SCOPE") or None,
            "expected_head": os.environ["EXPECTED_CHECKOUT_SHA"],
            "prior_job_status": os.environ["CANDIDATE_PRIOR_STATUS"],
            "primary_upload_outcome": os.environ["CANDIDATE_PRIMARY_OUTCOME"],
            "compressed_receipts_bytes": archive.stat().st_size,
            "compressed_failure_payload_bytes": failure.stat().st_size if failure.exists() else None,
            "managed_actions_resource_intervals": "UNOBSERVED: checkout, setup-python, upload, post hooks",
            "whole_job_timing": "UNVERIFIED until actual Actions started_at/completed_at including post hooks",
            "campaign_budgets": (
                "Four focused EXTRA spans <=2100s each; separate aggregate <=9600s (160 job-minutes); separate successful uploaded artifacts <=104857600 bytes"
                if focused_extra else
                "Complete minimum312 support EXTRA span <=1200s; same separate EXTRA aggregate <=9600s (160 job-minutes); separate successful uploaded artifacts <=104857600 bytes"
                if extra else
                "All twelve STANDARD compute spans, minimum311, shared acceptance resolver and four fixed joins <=1200s each; aggregate <=9600s (160 job-minutes); successful uploaded artifacts <=104857600 bytes"
            ),
            "work_timeout_seconds": 2000 if focused_extra else 1100,
            "whole_job_timeout_seconds": 2100 if focused_extra else 1200,
            "failure_evidence": "Complete retained model/temp/setup payloads counted separately; raw fallback on pack/upload failure; missing/interrupted evidence cannot qualify",
        }
        accounting["execution_rss_mib"] = 5120 if os.environ["CANDIDATE_ID"] in {"locked312-a", "locked312-b"} else 4096
        accounting["extra_acceptance_rss_mib" if extra else "standard_acceptance_rss_mib"] = accounting["execution_rss_mib"]
        accounting["standard_part"] = os.environ.get("CANDIDATE_PART") or None
        Path(os.environ["CANDIDATE_DIR"] + "-accounting.json").write_text(json.dumps(accounting, indent=2) + "\n")
        PY
        BASH

    - name: Upload candidate receipts and resource observations
      id: receipts
      if: (matrix.scope != 'focused' || needs.acceptance-context.outputs.full_acceptance != 'true' || needs.acceptance-context.outputs.routine_activated != 'true') && (always() && steps.pack.outcome == 'success')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ matrix.lane == 'extra' && 'candidate-extra' || 'candidate-standard' }}-${{ matrix.id }}-${{ job.status }}
        path: |
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}.tar.gz
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-accounting.json
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-pack-resources/
        retention-days: ${{ job.status == 'success' && 7 || 14 }}
        compression-level: 0
        if-no-files-found: error

    - name: Upload complete retained failure models and temporary outputs
      id: failure_payloads
      if: (matrix.scope != 'focused' || needs.acceptance-context.outputs.full_acceptance != 'true' || needs.acceptance-context.outputs.routine_activated != 'true') && (always() && (steps.work.outcome != 'success' || steps.primary.outcome != 'success') && steps.pack.outcome == 'success')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ matrix.lane == 'extra' && 'candidate-extra' || 'candidate-standard' }}-${{ matrix.id }}-failure-payloads
        path: ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-failure-payloads.tar.gz
        retention-days: 14
        compression-level: 0
        if-no-files-found: error

    - name: Upload raw failure evidence when packing or upload is incomplete
      if: (matrix.scope != 'focused' || needs.acceptance-context.outputs.full_acceptance != 'true' || needs.acceptance-context.outputs.routine_activated != 'true') && (always() && (steps.pack.outcome != 'success' || steps.receipts.outcome != 'success' || ((steps.work.outcome != 'success' || steps.primary.outcome != 'success') && steps.failure_payloads.outcome != 'success')))
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ matrix.lane == 'extra' && 'candidate-extra' || 'candidate-standard' }}-${{ matrix.id }}-raw-failure-evidence
        path: |
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}/
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-work-resources/
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-pack-resources/
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-accounting.json
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-tmp/
          ${{ github.workspace }}/onnx/
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-node/npm-cache/_logs/
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-node/config/
        retention-days: 14
        include-hidden-files: true
        compression-level: 0
        if-no-files-found: error

  candidate-standard-locked312-join:
    name: candidate STANDARD ${{ matrix.id }} complete union
    needs: [acceptance-context, candidate-standard]
    if: always() && needs.acceptance-context.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - {id: locked311, python: '3.11', cohort: py311-owners}
        - {id: locked312, python: '3.12', cohort: py312-owners}
        - {id: locked313, python: '3.13', cohort: py313-owners}
        - {id: locked314, python: '3.14', cohort: py314-owners}
    permissions:
      contents: read
      actions: read
    env:
      EXPECTED_CHECKOUT_SHA: ${{ needs.acceptance-context.outputs.head_sha }}
      CANDIDATE_ID: ${{ matrix.id }}-join
      CANDIDATE_STANDARD_ID: ${{ matrix.id }}
      CANDIDATE_COHORT: internal_docs/precision/ci_standard/${{ matrix.cohort }}.json

    steps:
    - name: Initialize fixed join paths from the actual runner
      id: join-paths
      shell: bash
      run: |
        set -euo pipefail
        {
          printf 'CANDIDATE_DIR=%s/ci-candidate-%s-join\n' "$RUNNER_TEMP" "$CANDIDATE_STANDARD_ID"
          printf 'CANDIDATE_TOOLS=%s/ci-candidate-%s-join-tools\n' "$RUNNER_TEMP" "$CANDIDATE_STANDARD_ID"
          printf 'CANDIDATE_VENV=%s/ci-candidate-%s-join-venv\n' "$RUNNER_TEMP" "$CANDIDATE_STANDARD_ID"
          printf 'CANDIDATE_TMP=%s/ci-candidate-%s-join-tmp\n' "$RUNNER_TEMP" "$CANDIDATE_STANDARD_ID"
          printf 'CANDIDATE_DOWNLOADS=%s/ci-standard-part-downloads\n' "$RUNNER_TEMP"
        } >> "$GITHUB_ENV"

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.acceptance-context.outputs.head_sha }}

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python }}

    - name: Download complete ${{ matrix.id }} part a receipts
      if: always()
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: candidate-standard-${{ matrix.id }}-a-success
        path: ${{ runner.temp }}/ci-standard-part-downloads/a

    - name: Download complete ${{ matrix.id }} part b receipts
      if: always()
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: candidate-standard-${{ matrix.id }}-b-success
        path: ${{ runner.temp }}/ci-standard-part-downloads/b

    - name: Observe complete ${{ matrix.id }} receipt join
      id: join
      if: always()
      env:
        CANDIDATE_JOBS_API_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python -B scripts/run_with_resources.py \
          --output-dir "${CANDIDATE_DIR}-work-resources" --timeout-seconds 1100 \
          --max-rss-mib 4096 --min-available-mib 2048 --min-disk-free-mib 4096 \
          --disk-path "$RUNNER_TEMP" --disk-path "$GITHUB_WORKSPACE" -- \
          bash -euo pipefail - <<'BASH'
        mkdir "$CANDIDATE_DIR"
        exec > >(tee "$CANDIDATE_DIR/controlled.log") 2>&1
        jobs_api_token="${CANDIDATE_JOBS_API_TOKEN:?missing current-run read token}"
        unset CANDIDATE_JOBS_API_TOKEN
        mkdir -m 700 "$CANDIDATE_TMP"
        export TMPDIR="$CANDIDATE_TMP"
        expected_commit="$(git rev-parse --verify "${EXPECTED_CHECKOUT_SHA}^{commit}")"
        test "$(git rev-parse --verify 'HEAD^{commit}')" = "$expected_commit"

        # Artifacts retain their original authority paths. Validate every member
        # before extracting, reject links/special files, and bound all inputs.
        python -B - <<'PY_RESTORE_PARTS'
        import hashlib
        import json
        import os
        from pathlib import Path, PurePosixPath
        import stat
        import tarfile

        temporary = Path(os.environ["RUNNER_TEMP"])
        downloads = Path(os.environ["CANDIDATE_DOWNLOADS"])
        restored = []
        for part in ("a", "b"):
            name = "ci-candidate-" + os.environ["CANDIDATE_STANDARD_ID"] + "-" + part
            incoming = downloads / part
            archive = incoming / (name + ".tar.gz")
            expected_inputs = {archive.name, name + "-accounting.json", name + "-pack-resources"}
            if incoming.is_symlink() or not incoming.is_dir() or {p.name for p in incoming.iterdir()} != expected_inputs:
                raise ValueError("missing or unexpected complete part artifact layout: " + part)
            if not stat.S_ISREG(archive.lstat().st_mode) or archive.stat().st_size > 100 * 1024**2:
                raise ValueError("part archive is not a bounded regular file")
            roots = {name, name + "-work-resources", name + "-accounting.json", name + "-pack-resources"}
            if any(os.path.lexists(temporary / root) for root in roots):
                raise ValueError("original part destination already exists")
            members = []
            seen = set()
            expanded = 0
            with tarfile.open(archive, "r:gz") as stream:
                for member in stream:
                    path = PurePosixPath(member.name)
                    if len(members) >= 50000 or path.is_absolute() or not path.parts or ".." in path.parts or member.name.rstrip("/") != path.as_posix():
                        raise ValueError("noncanonical or excessive archive members")
                    if path.parts[0] not in {name, name + "-work-resources"} or path.as_posix() in seen:
                        raise ValueError("unexpected or duplicate archive destination")
                    if not (member.isdir() or member.isfile()) or member.size < 0 or member.size > 64 * 1024**2:
                        raise ValueError("archive links, special files, or excessive member size")
                    seen.add(path.as_posix())
                    expanded += member.size
                    if expanded > 512 * 1024**2:
                        raise ValueError("expanded part archive exceeds bound")
                    members.append((member, path))
                for member, path in members:
                    target = temporary.joinpath(*path.parts)
                    if member.isdir():
                        target.mkdir(parents=True, exist_ok=True)
                    else:
                        target.parent.mkdir(parents=True, exist_ok=True)
                        source = stream.extractfile(member)
                        if source is None:
                            raise ValueError("regular archive member has no payload")
                        with source, target.open("xb") as output:
                            while chunk := source.read(1024 * 1024):
                                output.write(chunk)
            # The upload also contains accounting and pack-resource sidecars.
            pending = [incoming / (name + "-accounting.json"), incoming / (name + "-pack-resources")]
            sidecar_entries = 0
            while pending:
                source = pending.pop()
                sidecar_entries += 1
                if sidecar_entries > 10000:
                    raise ValueError("part sidecars exceed member bound")
                relative = source.relative_to(incoming)
                target = temporary / relative
                mode = source.lstat().st_mode
                if stat.S_ISDIR(mode):
                    target.mkdir(parents=True, exist_ok=True)
                    pending.extend(source.iterdir())
                elif stat.S_ISREG(mode):
                    expanded += source.stat().st_size
                    if source.stat().st_size > 16 * 1024**2 or expanded > 512 * 1024**2:
                        raise ValueError("part sidecars exceed bounds")
                    target.parent.mkdir(parents=True, exist_ok=True)
                    with source.open("rb") as original, target.open("xb") as output:
                        while chunk := original.read(1024 * 1024):
                            output.write(chunk)
                else:
                    raise ValueError("part sidecar is a link or special file")
            if not (temporary / name / "run/run.json").is_file():
                raise ValueError("part has no original canonical run")
            digest = hashlib.sha256()
            with archive.open("rb") as source:
                while chunk := source.read(1024 * 1024):
                    digest.update(chunk)
            restored.append({"part": part, "archive_sha256": digest.hexdigest(), "archive_bytes": archive.stat().st_size, "expanded_bytes": expanded, "members": len(members), "original_root": str(temporary / name)})
        (Path(os.environ["CANDIDATE_DIR"]) / "receipt-transport.json").write_text(json.dumps(restored, indent=2) + "\n")
        PY_RESTORE_PARTS

        # Recreate each original Python environment in a separate project venv.
        # Only locked312 has the two original optional-source path slots.
        python -B - <<'PY_JOIN_ENV' > "$CANDIDATE_DIR/profile.env"
        import json
        import os
        from pathlib import Path
        import shlex

        profile = json.loads(Path(os.environ["CANDIDATE_COHORT"]).read_text())
        slots = {"${CHECKOUT}": os.environ["GITHUB_WORKSPACE"]}
        if os.environ["CANDIDATE_STANDARD_ID"] == "locked312":
            original_a = os.environ["RUNNER_TEMP"] + "/ci-candidate-locked312-a/optional-sources/"
            slots.update({"${MAXTEXT_SOURCE}": original_a + "maxtext", "${MAXDIFFUSION_SOURCE}": original_a + "maxdiffusion"})
        print("unset TF_CPP_MIN_LOG_LEVEL PYTEST_VERSION JAX2ONNX_NATIVE_BINDINGS_EVIDENCE_DIR")
        for name, value in profile["environment"].items():
            if name == "JAX2ONNX_NATIVE_BINDINGS_EVIDENCE_DIR":
                continue
            print("unset " + name if value is None else "export " + name + "=" + shlex.quote(slots.get(value, value)))
        print("export CANDIDATE_BOOTSTRAP_PIP=" + shlex.quote(profile["bootstrap"]["pip"]))
        PY_JOIN_ENV
        source "$CANDIDATE_DIR/profile.env"
        python -m venv "$CANDIDATE_TOOLS"
        "$CANDIDATE_TOOLS/bin/python" -m pip install 'poetry>=2.0,<3.0'
        python -m venv --without-pip "$CANDIDATE_VENV"
        "$CANDIDATE_TOOLS/bin/python" -m pip --python "$CANDIDATE_VENV/bin/python" \
          install "pip==$CANDIDATE_BOOTSTRAP_PIP"
        export VIRTUAL_ENV="$CANDIDATE_VENV"
        export PATH="$CANDIDATE_VENV/bin:$CANDIDATE_TOOLS/bin:$PATH"
        export POETRY_VIRTUALENVS_CREATE=false
        poetry --version > "$CANDIDATE_DIR/poetry-version.txt"
        poetry install --no-interaction
        if [[ "$CANDIDATE_STANDARD_ID" == locked312 ]]; then
          for part in a b; do
            original_root="$RUNNER_TEMP/ci-candidate-locked312-$part"
            mkdir "$original_root/optional-sources"
            for integration in MAXTEXT MAXDIFFUSION; do
              ref_name="JAX2ONNX_${integration}_REF"
              if [[ "$integration" == MAXTEXT ]]; then
                remote=https://github.com/AI-Hypercomputer/maxtext.git
                group=maxtext
              else
                remote=https://github.com/google/maxdiffusion.git
                group=maxdiffusion
              fi
              source_dir="$original_root/optional-sources/$group"
              git init "$source_dir"
              git -C "$source_dir" remote add origin "$remote"
              git -C "$source_dir" fetch --depth 1 origin "${!ref_name}"
              git -C "$source_dir" checkout --detach FETCH_HEAD
              test "$(git -C "$source_dir" rev-parse HEAD)" = "${!ref_name}"
              test -z "$(git -C "$source_dir" status --porcelain)"
              if [[ "$part" == a ]]; then poetry install --no-interaction --with "$group"; fi
            done
          done
        fi
        python -m pip list --format=json > "$CANDIDATE_DIR/installed-packages.json"
        # Source regeneration only: no pytest C/O collection, cases, or models.
        python scripts/generate_tests.py
        # One bounded, current-attempt API snapshot records the actual completed
        # part jobs, including their post hooks. Never log or redirect the token.
        CANDIDATE_JOBS_API_TOKEN="$jobs_api_token" python -B - <<'PY_JOB_OBSERVATIONS'
        import json
        import os
        from pathlib import Path
        import re
        import urllib.error
        import urllib.request

        class RejectRedirects(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, request, fp, code, message, headers, url):
                raise ValueError("jobs observation redirects are forbidden")

        repository = os.environ["GITHUB_REPOSITORY"]
        run_id = os.environ["GITHUB_RUN_ID"]
        attempt = os.environ["GITHUB_RUN_ATTEMPT"]
        if re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository) is None or not run_id.isdecimal() or not attempt.isdecimal():
            raise SystemExit("invalid current-run jobs observation identity")
        endpoint = "https://api.github.com/repos/" + repository + "/actions/runs/" + run_id + "/attempts/" + attempt + "/jobs?per_page=100"
        request = urllib.request.Request(endpoint, headers={
            "Authorization": "Bearer " + os.environ["CANDIDATE_JOBS_API_TOKEN"],
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
        })
        try:
            with urllib.request.build_opener(RejectRedirects()).open(request, timeout=20) as response:
                if response.status != 200 or response.headers.get("Link"):
                    raise ValueError("jobs snapshot is not one complete bounded page")
                payload = response.read(2 * 1024**2 + 1)
            if len(payload) > 2 * 1024**2:
                raise ValueError("jobs snapshot exceeds byte bound")
            document = json.loads(payload)
            if type(document) is not dict or type(document.get("total_count")) is not int or not 0 < document["total_count"] <= 100 or type(document.get("jobs")) is not list or len(document["jobs"]) != document["total_count"]:
                raise ValueError("jobs snapshot is incomplete or malformed")
        except (OSError, ValueError, urllib.error.URLError):
            raise SystemExit("current-attempt jobs observation could not be captured") from None
        (Path(os.environ["CANDIDATE_DIR"]) / "job-observations.json").write_bytes(payload)
        PY_JOB_OBSERVATIONS
        unset jobs_api_token
        python -B scripts/run_pytest_batches.py \
          --ci-join-standard-parts \
            "$RUNNER_TEMP/ci-candidate-${CANDIDATE_STANDARD_ID}-a/run" \
            "$RUNNER_TEMP/ci-candidate-${CANDIDATE_STANDARD_ID}-b/run" \
          --ci-standard-profile "$CANDIDATE_COHORT" \
          --ci-job-observations "$CANDIDATE_DIR/job-observations.json" \
          --output-dir "$CANDIDATE_DIR/run"
        BASH

    - name: Record join evidence accounting
      if: always()
      run: |
        python -B - <<'PY'
        import json
        import os
        from pathlib import Path
        import stat

        evidence = Path(os.environ["CANDIDATE_DIR"])
        evidence.mkdir(exist_ok=True)
        total = 0
        files = 0
        for root in (evidence, Path(str(evidence) + "-work-resources")):
            if root.exists():
                for path in root.rglob("*"):
                    mode = path.lstat().st_mode
                    if stat.S_ISREG(mode):
                        total += path.stat().st_size
                        files += 1
                    elif not stat.S_ISDIR(mode):
                        raise ValueError("join output contains a link or special file")
        if total > 100 * 1024**2 or files > 50000:
            raise ValueError("join receipts exceed bounded upload input")
        (evidence / "accounting.json").write_text(json.dumps({
            "candidate": os.environ["CANDIDATE_ID"],
            "expected_head": os.environ["EXPECTED_CHECKOUT_SHA"],
            "uncompressed_receipt_bytes_before_accounting": total,
            "execution_rss_mib": 4096,
            "standard_acceptance_rss_mib": 4096,
            "managed_actions_resource_intervals": "UNOBSERVED: checkout, setup-python, downloads, uploads, post hooks",
            "whole_job_timing": "UNVERIFIED until actual Actions started_at/completed_at including post hooks",
            "campaign_budgets": "All twelve STANDARD compute spans, minimum311, shared acceptance resolver and four fixed joins <=1200s each; aggregate <=9600s (160 job-minutes); successful uploaded artifacts <=104857600 bytes",
        }, indent=2) + "\n")
        PY

    - name: Upload complete ${{ matrix.id }} join result
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: candidate-standard-${{ matrix.id }}-join-${{ job.status }}
        path: |
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-join/
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-join-work-resources/
        retention-days: ${{ job.status == 'success' && 7 || 14 }}
        compression-level: 6
        if-no-files-found: error

    - name: Preserve complete failed join inputs and optional sources
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: candidate-standard-${{ matrix.id }}-join-failure-inputs
        path: |
          ${{ runner.temp }}/ci-standard-part-downloads/
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-a/
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-a-work-resources/
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-a-pack-resources/
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-a-accounting.json
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-b/
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-b-work-resources/
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-b-pack-resources/
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-b-accounting.json
          ${{ runner.temp }}/ci-candidate-${{ matrix.id }}-join-tmp/
        retention-days: 14
        include-hidden-files: true
        compression-level: 0
        if-no-files-found: warn

  exhaustive-web:
    name: Required exhaustive browser validation
    needs: acceptance-context
    if: needs.acceptance-context.outputs.full_acceptance == 'true' || needs.acceptance-context.outputs.routine_activated != 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/nightly-qs.yml
    with:
      head_sha: ${{ needs.acceptance-context.outputs.head_sha }}
      full_acceptance: true
