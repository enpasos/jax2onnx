name: Main baseline feasibility diagnostic

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/main-baseline-feasibility.yml
      - scripts/observe_main_ci_feasibility.py
      - internal_docs/precision/ci_main_py311_81ad6ca.json
      - tests/extra_tests/framework/test_main_ci_feasibility.py

permissions:
  contents: read

jobs:
  main-py311-feasibility:
    name: main Python 3.11 feasibility (non-required diagnostic)
    if: >-
      github.repository == 'enpasos/jax2onnx' &&
      github.event.pull_request.number == 277 &&
      github.event.pull_request.head.ref == 'precision-migration' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.before == '22a26871f9cc6021790e17676297d4f48d5fcb98'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact diagnostic driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: driver
          persist-credentials: false

      - name: Check out frozen original main subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 81ad6ca2592635c8d2ced6dbd77292c487f0351b
          path: subject
          persist-credentials: false

      - name: Verify both checkout identities before setup
        env:
          EXPECTED_DRIVER: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git -C driver rev-parse 'HEAD^{commit}')" = "$EXPECTED_DRIVER"
          test "$(git -C subject rev-parse 'HEAD^{commit}')" = 81ad6ca2592635c8d2ced6dbd77292c487f0351b
          test -z "$(git -C driver status --porcelain=v1)"
          test -z "$(git -C subject status --porcelain=v1)"

      - name: Set up original Python 3.11 cohort
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Observe one original main setup and guarded workload
        id: observe
        timeout-minutes: 33
        env:
          EXPECTED_DRIVER: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python -B driver/scripts/observe_main_ci_feasibility.py \
            --subject "$GITHUB_WORKSPACE/subject" \
            --evidence "$RUNNER_TEMP/main-ci-feasibility-evidence" \
            --expected-driver "$EXPECTED_DRIVER"

      - name: Upload complete scoped evidence bundle
        if: always() && steps.observe.outputs.bundle_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-main-py311-feasibility
          path: |
            ${{ runner.temp }}/main-ci-feasibility-evidence/evidence.tar.gz
            ${{ runner.temp }}/main-ci-feasibility-evidence/verdict.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Preserve full scoped records if bundling was incomplete
        if: always() && steps.observe.outputs.bundle_ready != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frozen-main-py311-feasibility-incomplete
          path: ${{ runner.temp }}/main-ci-feasibility-evidence
          retention-days: 7
          if-no-files-found: warn
